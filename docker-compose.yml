services:
  mdl-app:
    build: ./backend
    container_name: mdl-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data                                  # DB, cookies, backups, logs
      - ./staging:/staging                                # local disk staging
      - /home/awisely/Docker/plex/media/music:/library    # CIFS import target
      - engine-venv:/opt/engine-venv                      # yt-dlp self-updates persist here
    extra_hosts:
      - "host.docker.internal:host-gateway"               # Plex runs host-network on this box
    depends_on:
      - mdl-pot
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mdl-web:
    build: ./frontend
    container_name: mdl-web
    restart: unless-stopped
    ports:
      - "3000:80"          # single origin: serves UI and proxies /api/ to mdl-app
    depends_on:
      - mdl-app
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  mdl-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: mdl-pot
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  default:
    name: mdl-net

volumes:
  engine-venv:
